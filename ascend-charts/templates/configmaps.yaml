apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "ascend.fullname" . }}-backend-config
  labels:
    {{- include "ascend.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
data:
  {{- range $key, $val := .Values.backend.env }}
  {{ $key }}: {{ $val | quote }}
  {{- end }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "ascend.fullname" . }}-web-config
  labels:
    {{- include "ascend.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
data:
  {{- range $key, $val := .Values.web.env }}
  {{ $key }}: {{ $val | quote }}
  {{- end }}
