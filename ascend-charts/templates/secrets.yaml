{{- if not .Values.secrets.useExistingSecret -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "ascend.secretName" . }}
  labels:
    {{- include "ascend.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range $key, $val := .Values.secrets.values }}
  {{ $key }}: {{ $val | quote }}
  {{- end }}
{{- end }}
