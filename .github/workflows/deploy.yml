name: Build & Deploy

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "README.md"
      - "TODO.txt"
      - "LICENSE"
      - ".gitignore"
  workflow_dispatch:

concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  build-and-push:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build & Push Backend Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/backend/Dockerfile
          push: true
          tags: |
            desktooondocker/ascend-backend:latest
            desktooondocker/ascend-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & Push Web Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/web/Dockerfile
          build-args: |
            NEXT_PUBLIC_API_URL=https://api.ascend.example.com
            NEXT_PUBLIC_VAPID_PUBLIC_KEY=${{ secrets.NEXT_PUBLIC_VAPID_PUBLIC_KEY || '' }}
          push: true
          tags: |
            desktooondocker/ascend-web:latest
            desktooondocker/ascend-web:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-helm:
    name: Deploy to GKE via Helm
    needs: build-and-push
    runs-on: ubuntu-latest
    # Only runs Helm deployment if GCP_SA_KEY secret is present
    if: ${{ env.HAVE_GCP_SECRET != '' }}
    env:
      HAVE_GCP_SECRET: ${{ secrets.GCP_SA_KEY }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Connect to GKE Cluster
        uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: ${{ secrets.GKE_CLUSTER_NAME || 'ascend-cluster' }}
          location: ${{ secrets.GKE_LOCATION || 'us-central1-a' }}

      - name: Setup Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.14.0

      - name: Deploy Ascend via Helm
        run: |
          helm upgrade --install ascend-prod ./helm \
            -f ./helm/values-prod.yaml \
            --namespace prod \
            --create-namespace \
            --set backend.image.tag="${{ github.sha }}" \
            --set web.image.tag="${{ github.sha }}" \
            --set secrets.values.DATABASE_URL="${{ secrets.DATABASE_URL }}" \
            --set secrets.values.JWT_ACCESS_SECRET="${{ secrets.JWT_ACCESS_SECRET }}" \
            --set secrets.values.JWT_REFRESH_SECRET="${{ secrets.JWT_REFRESH_SECRET }}" \
            --set secrets.values.BCRYPT_SECRET_PEPPER="${{ secrets.BCRYPT_SECRET_PEPPER }}" \
            --set secrets.values.MONGODB_URI="${{ secrets.MONGODB_URI }}" \
            --set secrets.values.AWS_IAM_ACCESS_KEY="${{ secrets.AWS_IAM_ACCESS_KEY }}" \
            --set secrets.values.AWS_IAM_SECRET_ACCESS_KEY="${{ secrets.AWS_IAM_SECRET_ACCESS_KEY }}" \
            --set secrets.values.OCI_PRIVATE_KEY="${{ secrets.OCI_PRIVATE_KEY }}" \
            --set secrets.values.OCI_TENANCY="${{ secrets.OCI_TENANCY }}" \
            --set secrets.values.OCI_USER="${{ secrets.OCI_USER }}" \
            --set secrets.values.OCI_FINGERPRINT="${{ secrets.OCI_FINGERPRINT }}" \
            --set secrets.values.OCI_REGION="${{ secrets.OCI_REGION }}" \
            --set secrets.values.OCI_NAMESPACE="${{ secrets.OCI_NAMESPACE }}" \
            --set secrets.values.OCI_BUCKET_NAME="${{ secrets.OCI_BUCKET_NAME }}" \
            --set secrets.values.RESEND_API="${{ secrets.RESEND_API }}" \
            --set secrets.values.VAPID_PUBLIC_KEY="${{ secrets.VAPID_PUBLIC_KEY }}" \
            --set secrets.values.VAPID_PRIVATE_KEY="${{ secrets.VAPID_PRIVATE_KEY }}" \
            --set secrets.values.GOOGLE_AUTH_CLIENT_ID="${{ secrets.GOOGLE_AUTH_CLIENT_ID }}" \
            --set secrets.values.GOOGLE_AUTH_CLIENT_SECRET="${{ secrets.GOOGLE_AUTH_CLIENT_SECRET }}" \
            --set secrets.values.GOOGLE_CALLBACK_URL="${{ secrets.GOOGLE_CALLBACK_URL }}" \
            --set secrets.values.GH_AUTH_CLIENT_ID="${{ secrets.GH_AUTH_CLIENT_ID }}" \
            --set secrets.values.GH_AUTH_CLIENT_SECRET="${{ secrets.GH_AUTH_CLIENT_SECRET }}" \
            --set secrets.values.GH_CALLBACK_URL="${{ secrets.GH_CALLBACK_URL }}" \
            --set secrets.values.AWS_REGION="${{ secrets.AWS_REGION }}" \
            --set secrets.values.NEXT_PUBLIC_VAPID_PUBLIC_KEY="${{ secrets.NEXT_PUBLIC_VAPID_PUBLIC_KEY }}" \
            --set secrets.values.NEXT_PUBLIC_API_URL="${{ secrets.NEXT_PUBLIC_API_URL }}"
