name: Web CI

on:
  pull_request:
    branches: [main]
    paths:
      - "apps/web/**"
      - "packages/eslint-config/**"
      - "packages/typescript-config/**"
      - "pnpm-lock.yaml"
      - "package.json"
      - "turbo.json"
      - ".github/workflows/ci-web.yml"
  push:
    branches: [main]
    paths:
      - "apps/web/**"
      - "packages/eslint-config/**"
      - "packages/typescript-config/**"
      - "pnpm-lock.yaml"
      - "package.json"
      - "turbo.json"
      - ".github/workflows/ci-web.yml"
  workflow_dispatch:

concurrency:
  group: ci-web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    name: Web Lint, Test & Build
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_API_URL: "https://api.ascend.example.com"
      NEXT_PUBLIC_VAPID_PUBLIC_KEY: "dummy_public_key_for_ci_build"
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.4.2
          run_install: false

      - name: Setup Node.js with pnpm Store Cache
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Cache Turborepo Task Artifacts
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-web-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-web-${{ runner.os }}-

      - name: Cache Next.js Build Cache
        uses: actions/cache@v4
        with:
          path: apps/web/.next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('apps/web/**.[jt]s', 'apps/web/**.[jt]sx') }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint Web App
        run: pnpm --filter web lint

      - name: Run Web Tests (Vitest + JSDOM)
        run: pnpm --filter web test

      - name: Build Web App (Next.js)
        run: pnpm --filter web build
