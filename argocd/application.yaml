apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ascend
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Desktoo/Ascend
    targetRevision: main
    path: helm
    helm:
      releaseName: ascend-prod
      valueFiles:
        - values-prod.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: prod
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - RespectIgnoreDifferences=true
  ignoreDifferences:
    - group: apps
      kind: Deployment
      jsonPointers:
        - /spec/replicas
        - /spec/template/spec/containers/0/image
