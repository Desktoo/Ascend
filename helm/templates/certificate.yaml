apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
  labels:
    {{- include "ascend.labels" . | nindent 4 }}
spec:
  acme:
    email: akshatkri1463@gmail.com
    server: https://acme-v02.api.letsencrypt.org/directory
    privateKeySecretRef:
      name: letsencrypt-prod-account-key
    solvers:
      - dns01:
          cloudflare:
            apiTokenSecretRef:
              name: cloudflare-api-token-secret
              key: api-token
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ .Values.ingress.tls.secretName | default "ascend-prod-tls-cert" }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ascend.labels" . | nindent 4 }}
spec:
  secretName: {{ .Values.ingress.tls.secretName | default "ascend-prod-tls-cert" }}
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  dnsNames:
    - "ascendup.online"
    - "*.ascendup.online"
