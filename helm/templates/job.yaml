{{- if .Values.migration.enabled -}}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "ascend.fullname" . }}-db-migrate
  labels:
    {{- include "ascend.labels" . | nindent 4 }}
    app.kubernetes.io/component: migration
  annotations:
    # Runs after ConfigMaps and SealedSecrets are installed/upgraded
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "1"
    # Deletes any previous completed/failed migration job before creating a new one
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  # Number of retries before marking job as failed
  backoffLimit: 3
  template:
    metadata:
      labels:
        {{- include "ascend.labels" . | nindent 8 }}
        app.kubernetes.io/component: migration
    spec:
      restartPolicy: OnFailure
      containers:
        - name: db-migrator
          image: "{{ .Values.migration.image.repository }}:{{ .Values.migration.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.migration.image.pullPolicy }}
          command:
            {{- toYaml .Values.migration.command | nindent 12 }}
          envFrom:
            - configMapRef:
                name: {{ include "ascend.fullname" . }}-backend-config
            - secretRef:
                name: {{ include "ascend.secretName" . }}
{{- end }}
