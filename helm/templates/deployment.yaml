# ==============================================================================
# 1. Backend API Deployment (NestJS + BullMQ)
# ==============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ascend.fullname" . }}-backend
  labels:
    {{- include "ascend.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  replicas: {{ .Values.backend.replicaCount }}
  selector:
    matchLabels:
      {{- include "ascend.backendSelectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "ascend.backendSelectorLabels" . | nindent 8 }}
    spec:
      containers:
        - name: backend
          image: "{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.backend.service.targetPort }}
              protocol: TCP
          envFrom:
            # Loads non-sensitive settings (PORT, NODE_ENV, AWS_REGION, etc.)
            - configMapRef:
                name: {{ include "ascend.fullname" . }}-backend-config
            # Loads credentials (DATABASE_URL, JWT secrets, Redis/Mongo URIs, etc.)
            - secretRef:
                name: {{ include "ascend.secretName" . }}
          livenessProbe:
            httpGet:
              path: {{ .Values.backend.probes.liveness.path }}
              port: {{ .Values.backend.probes.liveness.port }}
            initialDelaySeconds: {{ .Values.backend.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.backend.probes.liveness.periodSeconds }}
            failureThreshold: {{ .Values.backend.probes.liveness.failureThreshold }}
          readinessProbe:
            httpGet:
              path: {{ .Values.backend.probes.readiness.path }}
              port: {{ .Values.backend.probes.readiness.port }}
            initialDelaySeconds: {{ .Values.backend.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.backend.probes.readiness.periodSeconds }}
            failureThreshold: {{ .Values.backend.probes.readiness.failureThreshold }}
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
---
# ==============================================================================
# 2. Frontend Web App Deployment (Next.js 16)
# ==============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ascend.fullname" . }}-web
  labels:
    {{- include "ascend.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  replicas: {{ .Values.web.replicaCount }}
  selector:
    matchLabels:
      {{- include "ascend.webSelectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "ascend.webSelectorLabels" . | nindent 8 }}
    spec:
      containers:
        - name: web
          image: "{{ .Values.web.image.repository }}:{{ .Values.web.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.web.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.web.service.targetPort }}
              protocol: TCP
          envFrom:
            # Loads non-sensitive settings (PORT, NEXT_PUBLIC_API_URL, etc.)
            - configMapRef:
                name: {{ include "ascend.fullname" . }}-web-config
            # Loads secrets (NEXT_PUBLIC_VAPID_PUBLIC_KEY, NEXT_PUBLIC_API_URL, etc.)
            - secretRef:
                name: {{ include "ascend.secretName" . }}
          livenessProbe:
            httpGet:
              path: {{ .Values.web.probes.liveness.path }}
              port: {{ .Values.web.probes.liveness.port }}
            initialDelaySeconds: {{ .Values.web.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.web.probes.liveness.periodSeconds }}
            failureThreshold: {{ .Values.web.probes.liveness.failureThreshold }}
          readinessProbe:
            httpGet:
              path: {{ .Values.web.probes.readiness.path }}
              port: {{ .Values.web.probes.readiness.port }}
            initialDelaySeconds: {{ .Values.web.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.web.probes.readiness.periodSeconds }}
            failureThreshold: {{ .Values.web.probes.readiness.failureThreshold }}
          resources:
            {{- toYaml .Values.web.resources | nindent 12 }}
---
# ==============================================================================
# 3. Redis Deployment (BullMQ Store + Hot Cache backed by GCP PVC)
# ==============================================================================
{{- if .Values.redis.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.redis.name | default "redis" }}
  labels:
    {{- include "ascend.labels" . | nindent 4 }}
    app.kubernetes.io/component: redis
spec:
  replicas: {{ .Values.redis.replicaCount | default 1 }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "ascend.redisSelectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "ascend.redisSelectorLabels" . | nindent 8 }}
    spec:
      containers:
        - name: redis
          image: "{{ .Values.redis.image.repository }}:{{ .Values.redis.image.tag }}"
          imagePullPolicy: {{ .Values.redis.image.pullPolicy | default "IfNotPresent" }}
          command:
            - "redis-server"
            - "--appendonly"
            - "yes"
            - "--protected-mode"
            - "no"
          ports:
            - name: redis
              containerPort: {{ .Values.redis.service.targetPort | default 6379 }}
              protocol: TCP
          livenessProbe:
            tcpSocket:
              port: redis
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            exec:
              command:
                - redis-cli
                - ping
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            {{- toYaml .Values.redis.resources | nindent 12 }}
          volumeMounts:
            - name: redis-data
              mountPath: {{ .Values.redis.persistence.mountPath | default "/data" }}
      volumes:
        - name: redis-data
          {{- if and .Values.redis.persistence.enabled .Values.persistence.bullmq.enabled }}
          persistentVolumeClaim:
            claimName: {{ .Values.persistence.bullmq.pvcName | default "ascend-bullmq-store-pvc" }}
          {{- else }}
          emptyDir: {}
          {{- end }}
{{- end }}
