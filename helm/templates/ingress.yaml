{{- if .Values.ingress.enabled -}}
{{- if and .Values.ingress.managedCertificate .Values.ingress.managedCertificate.enabled -}}
apiVersion: networking.gke.io/v1
kind: ManagedCertificate
metadata:
  name: {{ .Values.ingress.managedCertificate.name | default (printf "%s-managed-cert" (include "ascend.fullname" .)) }}
  labels:
    {{- include "ascend.labels" . | nindent 4 }}
spec:
  domains:
    - {{ .Values.ingress.webHost | quote }}
    - {{ .Values.ingress.backendHost | quote }}
---
{{- end }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "ascend.fullname" . }}-ingress
  labels:
    {{- include "ascend.labels" . | nindent 4 }}
  annotations:
    {{- with .Values.ingress.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
    {{- if and .Values.ingress.managedCertificate .Values.ingress.managedCertificate.enabled }}
    networking.gke.io/managed-certificates: {{ .Values.ingress.managedCertificate.name | default (printf "%s-managed-cert" (include "ascend.fullname" .)) | quote }}
    {{- end }}
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className }}
  {{- end }}
  # Default backend serves the Web UI when accessing the Load Balancer IP directly
  defaultBackend:
    service:
      name: {{ include "ascend.fullname" . }}-web
      port:
        number: {{ .Values.web.service.port }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts:
        - {{ .Values.ingress.webHost | quote }}
        - {{ .Values.ingress.backendHost | quote }}
      secretName: {{ .Values.ingress.tls.secretName }}
  {{- end }}
  rules:
    # Web UI traffic (e.g., app.ascend.example.com) -> Web Service
    - host: {{ .Values.ingress.webHost | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "ascend.fullname" . }}-web
                port:
                  number: {{ .Values.web.service.port }}
    # API traffic (e.g., api.ascend.example.com) -> Backend Service
    - host: {{ .Values.ingress.backendHost | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "ascend.fullname" . }}-backend
                port:
                  number: {{ .Values.backend.service.port }}
{{- end }}

