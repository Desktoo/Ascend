# ==============================================================================
# Ascend Helm Values — STAGING Environment
# ==============================================================================
# Usage:
#   helm upgrade --install ascend-staging ./helm \
#     -f ./helm/values-staging.yaml \
#     --namespace staging --create-namespace
# ==============================================================================

global:
  environment: staging
  appName: ascend

# Namespace setup for Staging
namespace:
  create: true
  name: staging

# ------------------------------------------------------------------------------
# 1. Backend (Staging: 1 Pod, lower resource foot-print)
# ------------------------------------------------------------------------------
backend:
  replicaCount: 1

  image:
    repository: desktooondocker/ascend-backend
    pullPolicy: IfNotPresent
    tag: "staging" # Or latest commit tag

  service:
    type: ClusterIP
    port: 3000
    targetPort: 3000

  # Turn off autoscaling in staging to save cloud costs
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 2
    targetCPUUtilizationPercentage: 80

  resources:
    limits:
      cpu: 300m
      memory: 384Mi
    requests:
      cpu: 100m
      memory: 200Mi

  env:
    PORT: "3000"
    NODE_ENV: "staging"
    AWS_REGION: "us-east-1"
    GOOGLE_CALLBACK_URL: "https://api.staging.ascend.example.com/api/auth/google/callback"
    GITHUB_CALLBACK_URL: "https://api.staging.ascend.example.com/api/auth/github/callback"

# ------------------------------------------------------------------------------
# 2. Frontend Web (Staging: 1 Pod)
# ------------------------------------------------------------------------------
web:
  replicaCount: 1

  image:
    repository: desktooondocker/ascend-web
    pullPolicy: IfNotPresent
    tag: "staging"

  service:
    type: ClusterIP
    port: 3001
    targetPort: 3001

  autoscaling:
    enabled: false

  resources:
    limits:
      cpu: 250m
      memory: 256Mi
    requests:
      cpu: 100m
      memory: 128Mi

  env:
    PORT: "3001"
    NODE_ENV: "staging"
    NEXT_PUBLIC_API_URL: "https://api.staging.ascend.example.com"
    NEXT_PUBLIC_VAPID_PUBLIC_KEY: "YOUR_STAGING_VAPID_PUBLIC_KEY"

# ------------------------------------------------------------------------------
# 3. Database Migration Job
# ------------------------------------------------------------------------------
migration:
  enabled: true
  image:
    repository: desktooondocker/ascend-backend
    pullPolicy: IfNotPresent
    tag: "staging"

# ------------------------------------------------------------------------------
# 4. Secrets (Staging databases)
# ------------------------------------------------------------------------------
secrets:
  useExistingSecret: false
  existingSecretName: "ascend-staging-secrets"

  values:
    DATABASE_URL: ""
    MONGODB_URI: ""
    QUEUE_REDIS_URL: ""
    UPSTASH_REDIS_URL: ""
    JWT_ACCESS_SECRET: ""
    JWT_REFRESH_SECRET: ""
    BCRYPT_SECRET_PEPPER: ""
    AWS_REGION: ""
    AWS_IAM_ACCESS_KEY: ""
    AWS_IAM_SECRET_ACCESS_KEY: ""
    RESEND_API: ""
    VAPID_PUBLIC_KEY: ""
    VAPID_PRIVATE_KEY: ""
    GOOGLE_AUTH_CLIENT_ID: ""
    GOOGLE_AUTH_CLIENT_SECRET: ""
    GOOGLE_CALLBACK_URL: ""
    GH_AUTH_CLIENT_ID: ""
    GH_AUTH_CLIENT_SECRET: ""
    GH_CALLBACK_URL: ""
    NEXT_PUBLIC_VAPID_PUBLIC_KEY: ""
    NEXT_PUBLIC_API_URL: ""
    OCI_PRIVATE_KEY: ""
    OCI_TENANCY: ""
    OCI_USER: ""
    OCI_FINGERPRINT: ""
    OCI_REGION: ""
    OCI_NAMESPACE: ""
    OCI_BUCKET_NAME: ""

# ------------------------------------------------------------------------------
# 5. Ingress (Staging subdomains)
# ------------------------------------------------------------------------------
ingress:
  enabled: true
  className: "nginx"
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-staging"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
  webHost: "app.staging.ascend.example.com"
  backendHost: "api.staging.ascend.example.com"
  tls:
    enabled: true
    secretName: "ascend-staging-tls-cert"

# ------------------------------------------------------------------------------
# 6. Persistent Storage (Disabled in staging by default to avoid disk conflict)
# ------------------------------------------------------------------------------
persistence:
  bullmq:
    enabled: false
    diskName: "ascend-bullmq-store-disk-staging"
    pvName: "ascend-bullmq-store-staging-pv"
    pvcName: "ascend-bullmq-store-staging-pvc"
    capacity: "10Gi"
    storageClassName: "manual"
    accessMode: "ReadWriteOnce"
    reclaimPolicy: "Retain"
    fsType: "ext4"

# ------------------------------------------------------------------------------
# 7. Redis Service (Staging BullMQ Store - uses emptyDir)
# ------------------------------------------------------------------------------
redis:
  enabled: true
  name: "redis"
  replicaCount: 1
  image:
    repository: "redis"
    tag: "7-alpine"
    pullPolicy: "IfNotPresent"
  service:
    name: "redis"
    type: "ClusterIP"
    port: 6379
    targetPort: 6379
  # In staging, persistence is disabled so it uses an emptyDir volume (no GCP disk required)
  persistence:
    enabled: false
    mountPath: "/data"
  resources:
    limits:
      cpu: 200m
      memory: 192Mi
    requests:
      cpu: 50m
      memory: 64Mi


