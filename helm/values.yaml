# ==============================================================================
# Ascend (Day Mark) - Helm Chart Values
# ==============================================================================
# This file is the single control panel for your entire Kubernetes deployment.
# Your template files (deployment.yaml, service.yaml, configmap.yaml, etc.)
# will read values from here using: {{ .Values.backend.image.repository }}, etc.
# ==============================================================================

# ------------------------------------------------------------------------------
# Global / Shared Metadata
# ------------------------------------------------------------------------------
global:
  environment: production
  appName: ascend

# ------------------------------------------------------------------------------
# Namespace Configuration
# ------------------------------------------------------------------------------
namespace:
  # Set to true if you want Helm to generate the Namespace resource.
  # Otherwise, deploy using: helm install ... --namespace <staging|prod> --create-namespace
  create: false
  name: ""

# ------------------------------------------------------------------------------
# 1. Backend Service (NestJS API + BullMQ Queue Workers)
# ------------------------------------------------------------------------------
backend:
  replicaCount: 2

  image:
    repository: desktooondocker/ascend-backend
    pullPolicy: IfNotPresent
    # Overrides the image tag whose default is the chart appVersion in Chart.yaml
    tag: "latest"

  service:
    type: ClusterIP
    port: 3000
    targetPort: 3000

  # Horizontal Pod Autoscaler (HPA) settings
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 5
    targetCPUUtilizationPercentage: 75
    targetMemoryUtilizationPercentage: 80

  # Container compute resource boundaries
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 200m
      memory: 256Mi

  # Health checking probes
  probes:
    liveness:
      path: /
      port: 3000
      initialDelaySeconds: 20
      periodSeconds: 15
      failureThreshold: 3
    readiness:
      path: /
      port: 3000
      initialDelaySeconds: 10
      periodSeconds: 10
      failureThreshold: 3

  # Non-sensitive environment variables (baked into a ConfigMap)
  env:
    PORT: "3000"
    NODE_ENV: "production"
    AWS_REGION: "us-east-1"
    GOOGLE_CALLBACK_URL: "https://api.ascend.example.com/api/auth/google/callback"
    GITHUB_CALLBACK_URL: "https://api.ascend.example.com/api/auth/github/callback"

# ------------------------------------------------------------------------------
# 2. Frontend Service (Next.js 16 Web App)
# ------------------------------------------------------------------------------
web:
  replicaCount: 2

  image:
    repository: desktooondocker/ascend-web
    pullPolicy: IfNotPresent
    tag: "latest"

  service:
    type: ClusterIP
    port: 3001
    targetPort: 3001

  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 4
    targetCPUUtilizationPercentage: 75
    targetMemoryUtilizationPercentage: 80

  resources:
    limits:
      cpu: 400m
      memory: 384Mi
    requests:
      cpu: 150m
      memory: 192Mi

  probes:
    liveness:
      path: /
      port: 3001
      initialDelaySeconds: 15
      periodSeconds: 15
      failureThreshold: 3
    readiness:
      path: /
      port: 3001
      initialDelaySeconds: 10
      periodSeconds: 10
      failureThreshold: 3

  # Non-sensitive environment variables (baked into a ConfigMap)
  env:
    PORT: "3001"
    NODE_ENV: "production"
    NEXT_PUBLIC_API_URL: "https://api.ascend.example.com"
    NEXT_PUBLIC_VAPID_PUBLIC_KEY: "YOUR_VAPID_PUBLIC_KEY"

# ------------------------------------------------------------------------------
# 3. Database Migration Job (Prisma DB Push / Migrate Hook)
# ------------------------------------------------------------------------------
# Runs as a Kubernetes Job before or alongside deployment rollouts
migration:
  enabled: true
  image:
    repository: desktooondocker/ascend-backend
    pullPolicy: IfNotPresent
    tag: "latest"
  # Command that applies Prisma schema updates to the PostgreSQL database
  command:
    - "sh"
    - "-c"
    - "cd packages/core/db && npx prisma db push --schema=prisma/schema.prisma --accept-data-loss"

# ------------------------------------------------------------------------------
# 4. Secrets Configuration (Managed via Bitnami Sealed Secrets)
# ------------------------------------------------------------------------------
secrets:
  useExistingSecret: true
  existingSecretName: "ascend-prod-secrets"


# ------------------------------------------------------------------------------
# 5. Ingress Controller (GKE Built-in HTTP/S Load Balancer)
# ------------------------------------------------------------------------------
ingress:
  enabled: false
  className: ""
  annotations:
    kubernetes.io/ingress.class: "gce"
    # Uncomment once you reserve a static IP via: gcloud compute addresses create ascend-prod-ip --global
    # kubernetes.io/ingress.global-static-ip-name: "ascend-prod-ip"
  # Host domains
  rootHost: "ascendup.online"
  webHost: "app.ascendup.online"
  backendHost: "api.ascendup.online"
  # Google-managed SSL Certificate (enable once real domains point to Load Balancer IP)
  managedCertificate:
    enabled: false
    name: "ascend-managed-cert"
  # Manual Kubernetes TLS Secret (alternative to managedCertificate)
  tls:
    enabled: false
    secretName: "ascend-tls-cert"

# ------------------------------------------------------------------------------
# 6. Persistent Storage (GCP Persistent Disk for BullMQ / Redis)
# ------------------------------------------------------------------------------
persistence:
  bullmq:
    enabled: true
    # Exact name of the Persistent Disk created in Google Cloud Platform (GCP)
    diskName: "ascend-bullmq-store-disk"
    # If regional/zonal disambiguation is needed, volumeHandle can also be:
    # "projects/<PROJECT_ID>/zones/<ZONE>/disks/ascend-bullmq-store-disk"
    pvName: "ascend-bullmq-store-pv"
    pvcName: "ascend-bullmq-store-pvc"
    capacity: "10Gi"              # Size of the dynamically provisioned disk
    storageClassName: "standard-rwo" # GKE Autopilot default dynamic storage class
    accessMode: "ReadWriteOnce"
    reclaimPolicy: "Retain"       # Used only when storageClassName is "manual"
    fsType: "ext4"

# ------------------------------------------------------------------------------
# 7. Redis Service (BullMQ Queue Store + Hot Cache)
# ------------------------------------------------------------------------------
redis:
  enabled: true
  name: "redis"
  replicaCount: 1
  image:
    repository: "redis"
    tag: "7-alpine"
    pullPolicy: "IfNotPresent"
  service:
    name: "redis"
    type: "ClusterIP"
    port: 6379
    targetPort: 6379
  persistence:
    enabled: true
    mountPath: "/data"
  resources:
    limits:
      cpu: 300m
      memory: 256Mi
    requests:
      cpu: 100m
      memory: 128Mi


