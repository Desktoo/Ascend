# ==============================================================================
# Ascend (Day Mark) - Helm Chart Values
# ==============================================================================
# This file is the single control panel for your entire Kubernetes deployment.
# Your template files (deployment.yaml, service.yaml, configmap.yaml, etc.)
# will read values from here using: {{ .Values.backend.image.repository }}, etc.
# ==============================================================================

# ------------------------------------------------------------------------------
# Global / Shared Metadata
# ------------------------------------------------------------------------------
global:
  environment: production
  appName: ascend

# ------------------------------------------------------------------------------
# Namespace Configuration
# ------------------------------------------------------------------------------
namespace:
  # Set to true if you want Helm to generate the Namespace resource.
  # Otherwise, deploy using: helm install ... --namespace <staging|prod> --create-namespace
  create: false
  name: ""

# ------------------------------------------------------------------------------
# 1. Backend Service (NestJS API + BullMQ Queue Workers)
# ------------------------------------------------------------------------------
backend:
  replicaCount: 2

  image:
    repository: desktooondocker/ascend-backend
    pullPolicy: IfNotPresent
    # Overrides the image tag whose default is the chart appVersion in Chart.yaml
    tag: "latest"

  service:
    type: ClusterIP
    port: 3000
    targetPort: 3000

  # Horizontal Pod Autoscaler (HPA) settings
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 5
    targetCPUUtilizationPercentage: 75
    targetMemoryUtilizationPercentage: 80

  # Container compute resource boundaries
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 200m
      memory: 256Mi

  # Health checking probes
  probes:
    liveness:
      path: /health
      port: 3000
      initialDelaySeconds: 20
      periodSeconds: 15
      failureThreshold: 3
    readiness:
      path: /health
      port: 3000
      initialDelaySeconds: 10
      periodSeconds: 10
      failureThreshold: 3

  # Non-sensitive environment variables (baked into a ConfigMap)
  env:
    PORT: "3000"
    NODE_ENV: "production"
    AWS_REGION: "us-east-1"
    GOOGLE_CALLBACK_URL: "https://api.ascend.example.com/api/auth/google/callback"
    GITHUB_CALLBACK_URL: "https://api.ascend.example.com/api/auth/github/callback"

# ------------------------------------------------------------------------------
# 2. Frontend Service (Next.js 16 Web App)
# ------------------------------------------------------------------------------
web:
  replicaCount: 2

  image:
    repository: desktooondocker/ascend-web
    pullPolicy: IfNotPresent
    tag: "latest"

  service:
    type: ClusterIP
    port: 3001
    targetPort: 3001

  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 4
    targetCPUUtilizationPercentage: 75
    targetMemoryUtilizationPercentage: 80

  resources:
    limits:
      cpu: 400m
      memory: 384Mi
    requests:
      cpu: 150m
      memory: 192Mi

  probes:
    liveness:
      path: /
      port: 3001
      initialDelaySeconds: 15
      periodSeconds: 15
      failureThreshold: 3
    readiness:
      path: /
      port: 3001
      initialDelaySeconds: 10
      periodSeconds: 10
      failureThreshold: 3

  # Non-sensitive environment variables (baked into a ConfigMap)
  env:
    PORT: "3001"
    NODE_ENV: "production"
    NEXT_PUBLIC_API_URL: "https://api.ascend.example.com"
    NEXT_PUBLIC_VAPID_PUBLIC_KEY: "YOUR_VAPID_PUBLIC_KEY"

# ------------------------------------------------------------------------------
# 3. Database Migration Job (Prisma DB Push / Migrate Hook)
# ------------------------------------------------------------------------------
# Runs as a Kubernetes Job before or alongside deployment rollouts
migration:
  enabled: true
  image:
    repository: desktooondocker/ascend-backend
    pullPolicy: IfNotPresent
    tag: "latest"
  # Command that applies Prisma schema updates to the PostgreSQL database
  command:
    - "sh"
    - "-c"
    - "cd packages/core/db && npx prisma db push --schema=prisma/schema.prisma --accept-data-loss"

# ------------------------------------------------------------------------------
# 4. Secrets Configuration
# ------------------------------------------------------------------------------
# Production strategies:
# - If useExistingSecret is true: Pods attach to a secret created by AWS Secrets Manager / External Secrets Operator
# - If false: Helm creates a Kubernetes Secret using the 'values' object below (override via GitHub Actions --set)
secrets:
  useExistingSecret: false
  existingSecretName: "ascend-secrets"

  # Placeholders for Helm-managed secret template
  # DO NOT put real production credentials here in git!
  # Inject them at deploy time: helm install ... --set secrets.values.DATABASE_URL="..."
  values:
    DATABASE_URL: ""
    MONGODB_URI: ""
    QUEUE_REDIS_URL: ""
    UPSTASH_REDIS_URL: ""
    JWT_ACCESS_SECRET: ""
    JWT_REFRESH_SECRET: ""
    BCRYPT_SECRET_PEPPER: ""
    AWS_REGION: ""
    AWS_IAM_ACCESS_KEY: ""
    AWS_IAM_SECRET_ACCESS_KEY: ""
    RESEND_API: ""
    VAPID_PUBLIC_KEY: ""
    VAPID_PRIVATE_KEY: ""
    GOOGLE_AUTH_CLIENT_ID: ""
    GOOGLE_AUTH_CLIENT_SECRET: ""
    GOOGLE_CALLBACK_URL: ""
    GH_AUTH_CLIENT_ID: ""
    GH_AUTH_CLIENT_SECRET: ""
    GH_CALLBACK_URL: ""
    NEXT_PUBLIC_VAPID_PUBLIC_KEY: ""
    NEXT_PUBLIC_API_URL: ""
    OCI_PRIVATE_KEY: ""
    OCI_TENANCY: ""
    OCI_USER: ""
    OCI_FINGERPRINT: ""
    OCI_REGION: ""
    OCI_NAMESPACE: ""
    OCI_BUCKET_NAME: ""

# ------------------------------------------------------------------------------
# 5. Ingress Controller (Routing external traffic to Web & Backend)
# ------------------------------------------------------------------------------
ingress:
  enabled: false
  className: "nginx"
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/proxy-body-size: "5m"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
  # Host domains
  webHost: "app.ascend.example.com"
  backendHost: "api.ascend.example.com"
  # TLS / SSL setup
  tls:
    enabled: true
    secretName: "ascend-tls-cert"

# ------------------------------------------------------------------------------
# 6. Persistent Storage (GCP Persistent Disk for BullMQ / Redis)
# ------------------------------------------------------------------------------
persistence:
  bullmq:
    enabled: true
    # Exact name of the Persistent Disk created in Google Cloud Platform (GCP)
    diskName: "ascend-bullmq-store-disk"
    # If regional/zonal disambiguation is needed, volumeHandle can also be:
    # "projects/<PROJECT_ID>/zones/<ZONE>/disks/ascend-bullmq-store-disk"
    pvName: "ascend-bullmq-store-pv"
    pvcName: "ascend-bullmq-store-pvc"
    capacity: "10Gi"              # Size matching your GCP disk
    storageClassName: "manual"    # Uses static binding to prevent dynamic disk creation
    accessMode: "ReadWriteOnce"
    reclaimPolicy: "Retain"       # Keeps data intact in GCP even if PV/PVC is deleted
    fsType: "ext4"

# ------------------------------------------------------------------------------
# 7. Redis Service (BullMQ Queue Store + Hot Cache)
# ------------------------------------------------------------------------------
redis:
  enabled: true
  name: "redis"
  replicaCount: 1
  image:
    repository: "redis"
    tag: "7-alpine"
    pullPolicy: "IfNotPresent"
  service:
    name: "redis"
    type: "ClusterIP"
    port: 6379
    targetPort: 6379
  persistence:
    enabled: true
    mountPath: "/data"
  resources:
    limits:
      cpu: 300m
      memory: 256Mi
    requests:
      cpu: 100m
      memory: 128Mi


